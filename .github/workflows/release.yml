# Builds the USCF Print Agent for Windows and macOS and attaches the files to a
# GitHub Release, so the Shipping Station's "Install the print agent" page can
# link to https://github.com/<owner>/<repo>/releases/latest/download/<file>.
#
# Trigger: push a tag like agent-v0.1.0 (or run it by hand from the Actions tab).
# The binaries are unsigned: Windows shows "More info → Run anyway" once and macOS
# needs right-click → Open the first time.
name: Print agent release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22', cache-dependency-path: go.sum }
      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui -X main.Version=$VERSION" -o dist/uscf-print-agent-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/uscf-print-agent-windows-amd64.exe }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22', cache-dependency-path: go.sum }
      - name: Build universal binary and .pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist build
          # The menu-bar icon needs cgo on macOS; Go turns cgo off when cross-compiling, so force it on for both slices.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" -o build/agent-arm64 .
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" -o build/agent-amd64 .
          lipo -create -output build/uscf-print-agent build/agent-arm64 build/agent-amd64
          # The .pkg installs the binary to /usr/local/bin and starts it for the installing user.
          mkdir -p pkgroot/usr/local/bin scripts
          cp build/uscf-print-agent pkgroot/usr/local/bin/uscf-print-agent
          # After install: write the logged-in user's LaunchAgent and start it through
          # launchd, so it is running before the installer window closes and again
          # at every login. (A plain background process is killed when the installer exits.)
          cat > scripts/postinstall <<'EOF'
          #!/bin/sh
          user="$(stat -f '%Su' /dev/console)"
          uid="$(id -u "$user")"
          home="$(dscl . -read "/Users/$user" NFSHomeDirectory | awk '{print $2}')"
          plist="$home/Library/LaunchAgents/com.uscompoundingfactory.print-agent.plist"
          mkdir -p "$home/Library/LaunchAgents"
          cat > "$plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>com.uscompoundingfactory.print-agent</string>
            <key>ProgramArguments</key><array><string>/usr/local/bin/uscf-print-agent</string></array>
            <key>RunAtLoad</key><true/>
            <key>KeepAlive</key><true/>
            <key>ProcessType</key><string>Interactive</string>
          </dict></plist>
          PLIST
          chown "$user" "$plist"
          launchctl bootout "gui/$uid/com.uscompoundingfactory.print-agent" >/dev/null 2>&1 || true
          launchctl bootstrap "gui/$uid" "$plist" >/dev/null 2>&1 || sudo -u "$user" launchctl load "$plist" >/dev/null 2>&1 || true
          exit 0
          EOF
          chmod +x scripts/postinstall
          pkgbuild --root pkgroot --scripts scripts --identifier com.uscompoundingfactory.print-agent --version "$VERSION" --install-location / dist/uscf-print-agent-macos.pkg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/uscf-print-agent-macos.pkg }

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: USCF Print Agent ${{ github.ref_name }}
          files: |
            dist/uscf-print-agent-windows-amd64.exe
            dist/uscf-print-agent-macos.pkg
          body: |
            USCF Print Agent for the Shipping Station.

            **Windows**: download the `.exe`, run it (choose "More info → Run anyway" if Windows warns), then on the station open Printer setup and type the pairing code from the tray icon. It starts at login by itself from then on.

            **macOS**: download the `.pkg`. If macOS blocks it, open System Settings → Privacy & Security, scroll down and click "Open Anyway", then run the installer. It starts at login by itself; the pairing code is in the menu-bar icon.
