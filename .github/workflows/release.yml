# Builds the USCF Portal Print Agent for Windows and macOS and attaches the files to a
# GitHub Release, so the Shipping Station's "Install the print agent" page can
# link to https://github.com/<owner>/<repo>/releases/latest/download/<file>.
#
# Trigger: push a tag like agent-v0.1.0 (or run it by hand from the Actions tab).
# The binaries are unsigned: Windows shows "More info → Run anyway" once and macOS
# needs right-click → Open the first time.
name: Print agent release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22', cache-dependency-path: go.sum }
      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION=0.0.0
          # Icon + "USCF Portal Print Agent" name/version in the .exe's properties (winres/winres.json).
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --in winres/winres.json --arch amd64,386,arm64 --file-version "$VERSION" --product-version "$VERSION"
          # One .exe per processor; the station's setup page offers the one that fits the PC.
          # The 64-bit Intel/AMD file keeps the original name so older links still work.
          build() { CGO_ENABLED=0 GOOS=windows GOARCH="$1" go build -trimpath -ldflags "-s -w -H windowsgui -X main.Version=$VERSION" -o "dist/$2" .; }
          build amd64 USCF-Portal-Print-Agent.exe
          build 386   USCF-Portal-Print-Agent-32bit.exe
          build arm64 USCF-Portal-Print-Agent-ARM64.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22', cache-dependency-path: go.sum }
      - name: Build universal binary and .pkg
        # Without a deployment target the C compiler uses the runner's own macOS
        # version as the minimum (v0.3.1 needed macOS 26), and older Macs refuse
        # to start the agent. 10.15 is the oldest macOS Go 1.22 supports.
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          CGO_CFLAGS: -O2 -g -mmacosx-version-min=10.15
          CGO_LDFLAGS: -mmacosx-version-min=10.15
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist build
          # The menu-bar icon needs cgo on macOS; Go turns cgo off when cross-compiling, so force it on for both slices.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" -o build/agent-arm64 .
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" -o build/agent-amd64 .
          # Fail the release if either slice asks for a newer macOS than 10.15.
          for slice in build/agent-arm64 build/agent-amd64; do
            minos="$(otool -l "$slice" | awk '/LC_BUILD_VERSION/{f=1} f && $1=="minos"{print $2; exit}')"
            echo "$slice: minimum macOS $minos"
            [ -n "$minos" ] && [ "$(printf '%s\n10.15\n' "$minos" | sort -V | tail -n1)" = "10.15" ] || { echo "::error::$slice needs macOS '$minos'; expected 10.15"; exit 1; }
          done
          lipo -create -output build/uscf-print-agent build/agent-arm64 build/agent-amd64
          # The .pkg installs the binary to /usr/local/bin and starts it for the installing user.
          mkdir -p pkgroot/usr/local/bin scripts
          cp build/uscf-print-agent pkgroot/usr/local/bin/uscf-print-agent
          # After install: write the logged-in user's LaunchAgent and start it through
          # launchd, so it is running before the installer window closes and again
          # at every login. (A plain background process is killed when the installer exits.)
          cat > scripts/postinstall <<'EOF'
          #!/bin/sh
          user="$(stat -f '%Su' /dev/console)"
          uid="$(id -u "$user")"
          home="$(dscl . -read "/Users/$user" NFSHomeDirectory | awk '{print $2}')"
          plist="$home/Library/LaunchAgents/com.uscompoundingfactory.print-agent.plist"
          mkdir -p "$home/Library/LaunchAgents"
          cat > "$plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>com.uscompoundingfactory.print-agent</string>
            <key>ProgramArguments</key><array><string>/usr/local/bin/uscf-print-agent</string></array>
            <key>RunAtLoad</key><true/>
            <key>KeepAlive</key><true/>
            <key>ProcessType</key><string>Interactive</string>
          </dict></plist>
          PLIST
          chown "$user" "$plist"
          launchctl bootout "gui/$uid/com.uscompoundingfactory.print-agent" >/dev/null 2>&1 || true
          launchctl bootstrap "gui/$uid" "$plist" >/dev/null 2>&1 || sudo -u "$user" launchctl load "$plist" >/dev/null 2>&1 || true
          exit 0
          EOF
          chmod +x scripts/postinstall
          pkgbuild --root pkgroot --scripts scripts --identifier com.uscompoundingfactory.print-agent --version "$VERSION" --install-location / build/component.pkg
          # Wrap it so the Installer window has the product name, the icon and a short welcome text.
          mkdir -p resources
          cp assets/pkg-background.png resources/background.png
          cat > resources/welcome.html <<'EOF'
          <html><body style="font-family:-apple-system,Helvetica;font-size:13px">
          <p>This installs <b>USCF Portal Print Agent</b> on this Mac. It lets the Shipping Station print labels on this computer's printer and shows which barcode scanner is plugged in.</p>
          <p>After installing, look for its icon in the menu bar: it shows the pairing code to type into the station's printer setup.</p>
          </body></html>
          EOF
          cat > distribution.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="1">
            <title>USCF Portal Print Agent</title>
            <welcome file="welcome.html"/>
            <background file="background.png" alignment="bottomleft" scaling="none"/>
            <background-darkAqua file="background.png" alignment="bottomleft" scaling="none"/>
            <options customize="never" require-scripts="false" hostArchitectures="arm64,x86_64"/>
            <allowed-os-versions><os-version min="10.15"/></allowed-os-versions>
            <domains enable_localSystem="true"/>
            <choices-outline><line choice="default"/></choices-outline>
            <choice id="default" title="USCF Portal Print Agent"><pkg-ref id="com.uscompoundingfactory.print-agent"/></choice>
            <pkg-ref id="com.uscompoundingfactory.print-agent" version="$VERSION">component.pkg</pkg-ref>
          </installer-gui-script>
          EOF
          productbuild --distribution distribution.xml --resources resources --package-path build "dist/USCF-Portal-Print-Agent.pkg"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/USCF-Portal-Print-Agent.pkg }

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: USCF Portal Print Agent ${{ github.ref_name }}
          files: |
            dist/USCF-Portal-Print-Agent.exe
            dist/USCF-Portal-Print-Agent-32bit.exe
            dist/USCF-Portal-Print-Agent-ARM64.exe
            dist/USCF-Portal-Print-Agent.pkg
          body: |
            USCF Portal Print Agent for the Shipping Station.

            **Windows** (10 or 11): the station's Printer setup page picks the right file for the PC. By hand: `USCF-Portal-Print-Agent.exe` for most PCs (64-bit Intel/AMD), `-ARM64.exe` for ARM PCs (Snapdragon), `-32bit.exe` for 32-bit Windows. Run it (choose "More info → Run anyway" if Windows warns). It copies itself into your Programs folder and starts, so the download can be deleted. Then on the station open Printer setup and type the pairing code from the tray icon. It starts at login by itself from then on.

            **macOS**: download the `.pkg`. If macOS blocks it, open System Settings → Privacy & Security, scroll down and click "Open Anyway", then run the installer. It starts at login by itself; the pairing code is in the menu-bar icon.
